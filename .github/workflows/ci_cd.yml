name: CI/CD Scoring API

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies (OpenMP for LightGBM)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Set up uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Python Dependencies
        run: uv sync --frozen

      - name: Run Tests
        run: uv run pytest --cov=api --cov-report=term-missing

  build-docker:
    name: Build & Validate Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: credit-scoring-api:latest