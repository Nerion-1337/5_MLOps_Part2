<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" font-family="Segoe UI, Arial, sans-serif" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="450" fill="#ffffff"/>
  <text x="450" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#0f172a">Prêt à Dépenser – Architecture MLOps</text>

  <!-- Client -->
  <rect x="20" y="170" width="120" height="60" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="80" y="205" text-anchor="middle" fill="#0c4a6e">Client / Swagger</text>

  <!-- Docker container -->
  <rect x="190" y="60" width="300" height="300" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 4"/>
  <text x="200" y="80" fill="#1d4ed8" font-size="12" font-weight="bold">🐳 Conteneur Docker</text>

  <rect x="210" y="90" width="260" height="50" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="340" y="120" text-anchor="middle" fill="#14532d">FastAPI – api/main.py</text>

  <rect x="210" y="160" width="260" height="50" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="340" y="190" text-anchor="middle" fill="#713f12">Pydantic – api/schemas.py</text>

  <rect x="210" y="230" width="260" height="50" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="340" y="260" text-anchor="middle" fill="#4c1d95">ONNX Runtime (modèle .onnx)</text>

  <rect x="210" y="290" width="260" height="50" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="340" y="320" text-anchor="middle" fill="#7c2d12">logging_config.py (JSONL)</text>

  <!-- Internal arrows -->
  <line x1="340" y1="140" x2="340" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="210" x2="340" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="340" y1="280" x2="340" y2="290" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- Client <-> API -->
  <line x1="140" y1="190" x2="190" y2="190" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="190" y1="212" x2="140" y2="212" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <text x="165" y="182" text-anchor="middle" font-size="11" fill="#334155">POST</text>

  <!-- Monitoring chain -->
  <rect x="560" y="290" width="180" height="50" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="650" y="320" text-anchor="middle" fill="#7c2d12">api_predictions.jsonl</text>
  <rect x="560" y="200" width="180" height="50" rx="6" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
  <text x="650" y="230" text-anchor="middle" fill="#831843">Evidently (drift)</text>
  <rect x="560" y="110" width="180" height="50" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="650" y="140" text-anchor="middle" fill="#7f1d1d">Dashboard Streamlit</text>

  <line x1="470" y1="315" x2="560" y2="315" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="290" x2="650" y2="250" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>
  <line x1="650" y1="200" x2="650" y2="160" stroke="#334155" stroke-width="2" marker-end="url(#a)"/>

  <!-- CI/CD -->
  <rect x="20" y="385" width="860" height="45" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="450" y="413" text-anchor="middle" fill="#0f172a">GitHub Actions : Pytest (7 tests)  →  Build Docker  →  Déploiement</text>
</svg>
