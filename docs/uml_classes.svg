<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" font-family="Consolas, Menlo, monospace" font-size="13" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#334155" stroke-width="1.5"/>
    </marker>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="900" height="540" fill="#ffffff"/>
  <text x="450" y="20" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Diagramme UML – Structure logique du projet</text>

  <!-- PredictionRequest -->
  <g>
    <rect x="30" y="40" width="220" height="100" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <rect x="30" y="40" width="220" height="30" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
    <text x="140" y="60" text-anchor="middle" font-weight="bold" fill="#713f12">PredictionRequest</text>
    <text x="40" y="88" fill="#1e293b">«BaseModel» schemas.py</text>
    <text x="40" y="108" fill="#1e293b">+ features : float</text>
    <text x="40" y="126" fill="#1e293b">+ validation des types</text>
  </g>

  <!-- FastAPI -->
  <g>
    <rect x="340" y="40" width="240" height="130" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="340" y="40" width="240" height="30" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/>
    <text x="460" y="60" text-anchor="middle" font-weight="bold" fill="#14532d">FastAPI (main.py)</text>
    <text x="350" y="88" fill="#1e293b">- session : InferenceSession</text>
    <line x1="340" y1="98" x2="580" y2="98" stroke="#16a34a"/>
    <text x="350" y="118" fill="#1e293b">+ health()</text>
    <text x="350" y="138" fill="#1e293b">+ predict(req)</text>
    <text x="350" y="158" fill="#1e293b">+ load_model()</text>
  </g>

  <!-- PredictionResponse -->
  <g>
    <rect x="670" y="40" width="200" height="100" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
    <rect x="670" y="40" width="200" height="30" fill="#fde68a" stroke="#ca8a04" stroke-width="2"/>
    <text x="770" y="60" text-anchor="middle" font-weight="bold" fill="#713f12">PredictionResponse</text>
    <text x="680" y="88" fill="#1e293b">«BaseModel»</text>
    <text x="680" y="108" fill="#1e293b">+ probability : float</text>
    <text x="680" y="126" fill="#1e293b">+ decision : str</text>
  </g>

  <!-- OnnxExporter -->
  <g>
    <rect x="30" y="240" width="220" height="100" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="30" y="240" width="220" height="30" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="140" y="260" text-anchor="middle" font-weight="bold" fill="#4c1d95">export_onnx.py</text>
    <text x="40" y="288" fill="#1e293b">+ export(lgbm_model)</text>
    <text x="40" y="308" fill="#1e293b">+ check_parity()</text>
    <text x="40" y="328" fill="#1e293b">  écart max ≤ 5e-8</text>
  </g>

  <!-- JsonlLogger -->
  <g>
    <rect x="340" y="240" width="240" height="100" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <rect x="340" y="240" width="240" height="30" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
    <text x="460" y="260" text-anchor="middle" font-weight="bold" fill="#7c2d12">logging_config.py</text>
    <text x="350" y="288" fill="#1e293b">- path : api_predictions.jsonl</text>
    <text x="350" y="310" fill="#1e293b">+ log_prediction(features,</text>
    <text x="350" y="328" fill="#1e293b">    score, latency_ms)</text>
  </g>

  <!-- Profiler -->
  <g>
    <rect x="670" y="240" width="200" height="100" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="670" y="240" width="200" height="30" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="770" y="260" text-anchor="middle" font-weight="bold" fill="#4c1d95">profiling.py</text>
    <text x="680" y="288" fill="#1e293b">+ run_cprofile()</text>
    <text x="680" y="308" fill="#1e293b">+ benchmark()</text>
    <text x="680" y="328" fill="#1e293b">→ optimization_report</text>
  </g>

  <!-- DriftAnalysis -->
  <g>
    <rect x="190" y="410" width="250" height="100" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
    <rect x="190" y="410" width="250" height="30" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
    <text x="315" y="430" text-anchor="middle" font-weight="bold" fill="#831843">drift_analysis.py</text>
    <text x="200" y="458" fill="#1e293b">+ load_reference()</text>
    <text x="200" y="478" fill="#1e293b">+ load_production()</text>
    <text x="200" y="498" fill="#1e293b">+ run_report() → HTML</text>
  </g>

  <!-- Dashboard -->
  <g>
    <rect x="500" y="410" width="260" height="100" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="500" y="410" width="260" height="30" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="630" y="430" text-anchor="middle" font-weight="bold" fill="#7f1d1d">dashboard_monitoring.py</text>
    <text x="510" y="458" fill="#1e293b">+ show_volume()</text>
    <text x="510" y="478" fill="#1e293b">+ show_proba_and_latency()</text>
    <text x="510" y="498" fill="#1e293b">+ embed_evidently_report()</text>
  </g>

  <!-- Relations -->
  <line x1="340" y1="95" x2="250" y2="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="295" y="88" text-anchor="middle" font-size="11" fill="#334155">«uses»</text>
  <line x1="580" y1="95" x2="670" y2="95" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="625" y="88" text-anchor="middle" font-size="11" fill="#334155">«returns»</text>
  <line x1="460" y1="170" x2="460" y2="240" stroke="#334155" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="470" y="210" font-size="11" fill="#334155">log</text>
  <line x1="250" y1="265" x2="340" y2="150" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="260" y="200" font-size="11" fill="#334155">modèle .onnx</text>
  <line x1="670" y1="265" x2="580" y2="150" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="640" y="200" font-size="11" fill="#334155">benchmark</text>
  <line x1="400" y1="340" x2="340" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#s)"/>
  <line x1="520" y1="340" x2="600" y2="410" stroke="#334155" stroke-width="1.5" marker-end="url(#s)"/>
  <text x="370" y="385" font-size="11" fill="#334155">lit JSONL</text>
  <line x1="440" y1="460" x2="500" y2="460" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#o)"/>
  <text x="470" y="452" text-anchor="middle" font-size="11" fill="#334155">HTML</text>
</svg>
