[project]
name = "5-mlops-part2"
version = "0.1.0"
description = "Mise en production API de scoring et monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "lightgbm>=4.3.0",
    "matplotlib>=3.8.0",
    "mlflow>=2.11.0",
    "numpy>=1.26.0",
    "optuna>=3.6.0",
    "pandas>=2.2.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.0",
    "shap>=0.45.0",
    "streamlit>=1.32.0",
    "uvicorn>=0.28.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]